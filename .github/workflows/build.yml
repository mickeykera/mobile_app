name: Build

# Android and iOS are separate jobs on purpose. An iOS failure (missing
# Apple certificate, expired profile) must not block the Android artifact,
# so neither job uses needs: on the other.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The keystore and its passwords are gitignored, so CI has to be given
      # them. Decode the base64 keystore from KEYSTORE_BASE64 into the same
      # path key.properties expects.
      # If KEYSTORE_BASE64 is not provided, we fall back to debug signing
      # (which is NOT publishable to Play, but useful for CI verification).
      - name: Restore signing key (optional)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      # Guards against silently shipping a debug-signed artifact. The gradle
      # config falls back to the debug key when key.properties is missing,
      # which builds fine but is rejected by Play.
      - name: Verify APK is signed with the release key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found - cannot verify signing"
            exit 1
          fi
          SIG=$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -m1 'certificate DN')
          # Distinguish a real debug signature from a failed lookup, rather
          # than treating an empty result as "debug signed".
          if [ -z "$SIG" ]; then
            echo "::error::could not read a signer from the APK"
            exit 1
          fi
          echo "signer: $SIG"
          if echo "$SIG" | grep -q 'Android Debug'; then
            echo "::error::APK is signed with the debug key - not publishable"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: iOS (unsigned build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # An .ipa is a zip around a code signature, and Apple only issues
      # signing certificates to paid accounts. Without one we can still
      # prove the iOS target compiles, so this always runs and produces a
      # .app. A .app with no signature cannot be installed on a device -
      # it is for verifying the build, not for distribution.
      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Verify the bundle was actually produced
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app was not produced"
            find build/ios -maxdepth 2 -type d || true
            exit 1
          fi
          echo "bundle: $APP"
          du -sh "$APP"
          # Fail loudly if a signature is absent, so nobody mistakes this
          # artifact for a distributable IPA.
          if codesign -dv "$APP" 2>&1 | grep -q 'signature'; then
            echo "note: bundle carries a signature"
          else
            echo "note: bundle is UNSIGNED - not installable on a device"
          fi

      # upload-artifact zips the *contents* of a directory, which flattened
      # Runner.app into loose files. Repackage it into a real .ipa instead:
      # a Payload/Runner.app wrapper, which is the container format iOS
      # expects. The result is a genuine .ipa, but with no code signature
      # iOS will refuse to install it.
      - name: Package as IPA
        run: |
          set -e
          rm -rf build/ios/ipa_unsigned
          mkdir -p build/ios/ipa_unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_unsigned/Payload/
          cd build/ios/ipa_unsigned
          zip -qry ../Ascend-unsigned.ipa Payload
          cd - > /dev/null
          ls -la build/ios/Ascend-unsigned.ipa

      - name: Verify the IPA structure
        run: |
          IPA=build/ios/Ascend-unsigned.ipa
          if [ ! -f "$IPA" ]; then
            echo "::error::ipa was not produced"
            exit 1
          fi
          # An .ipa must contain Payload/<App>.app/Info.plist
          if ! unzip -l "$IPA" | grep -q 'Payload/Runner.app/Info.plist'; then
            echo "::error::ipa is missing Payload/Runner.app/Info.plist"
            unzip -l "$IPA" | head -20
            exit 1
          fi
          echo "ipa structure OK:"
          unzip -l "$IPA" | grep -E 'Payload/Runner.app/(Info.plist|Runner)$'
          echo "entries: $(unzip -l "$IPA" | tail -1 | awk '{print $2}')"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-iOS-Unsigned
          path: build/ios/Ascend-unsigned.ipa
          retention-days: 14


      # The signed path only runs once an Apple developer account, a
      # distribution certificate and a provisioning profile exist.
      - name: Decode iOS signing assets
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISION_PROFILE" > "$RUNNER_TEMP/Runner.mobileprovision"
          # Import into a throwaway keychain rather than the login keychain,
          # and lock it so the cert can't be read by later steps.
          security create-keychain -p ci-keychain
          security default-keychain -s ci-keychain
          security unlock-keychain -p ci-keychain
          security import "$RUNNER_TEMP/cert.p12" -k ci-keychain \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci-keychain -p ci-keychain > /dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/Runner.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        run: flutter build ipa --release

      - name: Upload IPA
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.ipa
          path: build/ios/ipa/*.ipa

      - name: Clean up keychain
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        run: security delete-keychain ci-keychain || true

