# org.gradle.java.home is intentionally not set. Pinning it to a machine
# specific JDK path (e.g. a sdkman install) breaks CI and every other
# contributor's build, since that path only exists on the machine where it
# was written. Gradle uses JAVA_HOME, which setup-java and Flutter both set.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.locale.providers=COMPAT
android.jetifier.enabled=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false